name: advocate-social-automation

services:
  # =================================================================
  # Advocate Content Portal (React dashboard + Express API)
  # Express serves the built React bundle and the API on one port (3300).
  # =================================================================
  advocate-web-portal:
    build:
      context: ./web
    container_name: advocate-web-portal
    restart: always
    ports:
      - "${WEB_PORT:-3300}:3300"
    environment:
      - NODE_ENV=production
      - WEB_PORT=3300
      - N8N_INTERNAL_URL=http://n8n-automation:5678
      - N8N_EXTERNAL_URL=http://n8n-automation:5678
      - POSTIZ_API_URL=http://postiz:5000
      - POSTIZ_API_KEY=${POSTIZ_API_KEY:-}
      - TZ=${TZ:-Asia/Kolkata}
    depends_on:
      - n8n
    networks:
      - advocate-network
      - postiz-network

  # =================================================================
  # n8n Workflow Automation Engine
  # =================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-automation
    restart: always
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_COMMUNITY_PACKAGES_ENABLED=${N8N_COMMUNITY_PACKAGES_ENABLED:-true}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      - N8N_DEFAULT_BINARY_DATA_MODE=${N8N_DEFAULT_BINARY_DATA_MODE:-filesystem}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-advocate-kavali-n8n-secure-key-2026}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      # Public-facing base URL. N8N_EDITOR_BASE_URL is what n8n uses to build
      # OAuth callback URLs, so it must match the redirect URI registered in
      # Google/Meta consoles: {N8N_PUBLIC_URL}/rest/oauth2-credential/callback
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL:-http://localhost:5678}
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - TZ=${TZ:-Asia/Kolkata}
      - POSTIZ_API_URL=http://postiz:5000
      - POSTIZ_API_KEY=${POSTIZ_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/data/n8n-workflows
    networks:
      - advocate-network
      - postiz-network

  # =================================================================
  # Postiz Social Media Scheduling Engine
  # =================================================================
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: always
    environment:
      # === Core Settings
      # All three derive from the single POSTIZ_PUBLIC_URL in .env
      MAIN_URL: ${POSTIZ_PUBLIC_URL:-http://localhost:4800}
      FRONTEND_URL: ${POSTIZ_PUBLIC_URL:-http://localhost:4800}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_PUBLIC_URL:-http://localhost:4800}/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET:-advocate-kavali-postiz-jwt-secret-key-32chars-min-2026}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local}
      REDIS_URL: ${REDIS_URL:-redis://postiz-redis:6379}
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      IS_GENERAL: ${POSTIZ_IS_GENERAL:-true}
      DISABLE_REGISTRATION: ${POSTIZ_DISABLE_REGISTRATION:-false}

      # === Storage Settings
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/uploads}
      NEXT_PUBLIC_UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/uploads}

      # === Social Media API Settings (6 platforms for the Advocate)
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
      X_URL: ${X_URL:-}
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}

      # === AI & Limits
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_LIMIT: ${POSTIZ_API_LIMIT:-100}
      NX_ADD_PLUGINS: false

    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "${POSTIZ_PORT:-4800}:5000"
    networks:
      - postiz-network
      - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    # Postiz boots nginx immediately but its NestJS backend needs 1-3 minutes to
    # start listening on :3000. Without this, compose reports "Started" while the
    # API still returns 502. Only 'node' exists in this image (no curl/wget/nc).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/public/v1/is-connected').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postiz-password}
      POSTGRES_USER: ${POSTGRES_USER:-postiz-user}
      POSTGRES_DB: ${POSTGRES_DB:-postiz-db-local}
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-postiz-user} -d ${POSTGRES_DB:-postiz-db-local}
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # =================================================================
  # Temporal Stack for Postiz Background Tasks
  # =================================================================
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: always
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U temporal
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    container_name: temporal
    restart: always
    ports:
      - '7233:7233'
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    restart: always
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      # Origin the Temporal UI is actually browsed from
      - TEMPORAL_CORS_ORIGINS=${TEMPORAL_UI_PUBLIC_URL:-http://localhost:8080}
    networks:
      - temporal-network
    ports:
      - '8080:8080'

volumes:
  n8n-data:
  postiz-postgres-data:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  temporal-es-data:
  temporal-pg-data:

networks:
  advocate-network:
    driver: bridge
  postiz-network:
    driver: bridge
  temporal-network:
    driver: bridge
