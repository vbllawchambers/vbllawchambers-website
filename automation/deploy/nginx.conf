# =============================================================================
# VBL Law Chambers — Advocate Social Automation Stack
# Nginx reverse proxy template (alternative to the Caddyfile in this folder)
#
# Usage on the VPS — ORDER MATTERS. The HTTPS blocks below reference certificate
# files, so nginx will refuse to start until those certificates exist. Issue them
# first using the HTTP-only block, then enable this file:
#
#   1. Point DNS A records for app. / postiz. / n8n.vbllawchambers.com at the server.
#
#   2. Obtain certificates first (webroot mode needs only port 80):
#        sudo mkdir -p /var/www/html
#        sudo certbot certonly --webroot -w /var/www/html \
#          -d app.vbllawchambers.com \
#          -d postiz.vbllawchambers.com \
#          -d n8n.vbllawchambers.com
#
#   3. Now install this config and reload:
#        sudo cp nginx.conf /etc/nginx/sites-available/advocate-automation
#        sudo ln -s /etc/nginx/sites-available/advocate-automation /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
#   4. Renewals are handled by certbot's systemd timer. Verify with:
#        sudo certbot renew --dry-run
#
# If you prefer the fully automatic path, use the Caddyfile in this same folder
# instead — Caddy obtains and renews certificates with no manual steps.
# =============================================================================

# --- Shared proxy + security settings ----------------------------------------
# Included into each location block below.
# (Kept as a file-local map rather than a separate include for portability.)

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# --- Redirect all plain HTTP to HTTPS ----------------------------------------
server {
	listen 80;
	listen [::]:80;
	server_name app.vbllawchambers.com postiz.vbllawchambers.com n8n.vbllawchambers.com;

	# Let certbot answer ACME challenges over HTTP
	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

# --- Content Portal (React dashboard + Express API) --------------------------
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name app.vbllawchambers.com;

	ssl_certificate     /etc/letsencrypt/live/app.vbllawchambers.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/app.vbllawchambers.com/privkey.pem;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
	server_tokens off;

	# Media uploads run up to 250MB (multer limit in web/server.js)
	client_max_body_size 250M;

	location / {
		proxy_pass http://127.0.0.1:3300;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade           $http_upgrade;
		proxy_set_header Connection        $connection_upgrade;

		# Large video uploads need generous timeouts
		proxy_read_timeout    600s;
		proxy_send_timeout    600s;
		proxy_request_buffering off;
	}
}

# --- Postiz social scheduling engine -----------------------------------------
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name postiz.vbllawchambers.com;

	ssl_certificate     /etc/letsencrypt/live/postiz.vbllawchambers.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/postiz.vbllawchambers.com/privkey.pem;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	server_tokens off;

	client_max_body_size 250M;

	# Postiz serves its frontend and its /api/* backend behind its own nginx
	# on container port 5000, published to the host on 4800.
	location / {
		proxy_pass http://127.0.0.1:4800;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade           $http_upgrade;
		proxy_set_header Connection        $connection_upgrade;

		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
		proxy_request_buffering off;
	}
}

# --- n8n workflow engine -----------------------------------------------------
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name n8n.vbllawchambers.com;

	ssl_certificate     /etc/letsencrypt/live/n8n.vbllawchambers.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/n8n.vbllawchambers.com/privkey.pem;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	server_tokens off;

	client_max_body_size 250M;

	location / {
		proxy_pass http://127.0.0.1:5678;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# REQUIRED for the n8n editor's push channel (/rest/push) and for
		# long-running webhook executions.
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_buffering off;
		proxy_cache off;

		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}

